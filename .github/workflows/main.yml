name: ESP-IDF CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP-IDF project
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32
          path: .
          command: |
            ./scripts/fetch_components.sh
            ./scripts/check_no_arduino_types.sh
            idf.py build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: heidelberg-1p3p-bin
          path: build/heidelberg-1p3p.bin
          if-no-files-found: error
